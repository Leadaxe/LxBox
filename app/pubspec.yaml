name: lxbox
description: L×Box — Android VPN client (sing-box / libbox CommandClient).
publish_to: 'none'

version: 2.20.0+22000500
# ↑ НЕ редактируется вручную. В `develop` здесь остаётся значение прошлого
# релиза; реальная версия пишется сюда ОДИН РАЗ — на merge-коммите в `main`,
# на который встаёт тег (§379, RELEASE_PROCESS.md §2.4). Так делается потому,
# что F-Droid `checkupdates` читает версию из исходников на коммите тега;
# на каждый коммит версию не бампим — от этого «дрожания» ушли в v2.11.x.
#
# Число после `+` — versionCode с ABI=0 (база). Обе сборки пересчитывают его
# перед `flutter build` через scripts/version-code.sh, добавляя цифру ABI:
#   • CI release (.github/workflows/ci.yml → "Inject release version") —
#     по прогону на таргет: universal/armv7/arm64/x86_64.
#   • Локальная сборка (scripts/build-local-apk.sh) — код последнего релизного
#     тега для arm64 (пин к тегу, §186 — против downgrade-блока).
# Runtime берёт версию из APK-манифеста через PackageInfo (lib/services/version_info.dart),
# а не из этой строки.

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # §285 — Global*Localizations (Flutter chrome строки)
    sdk: flutter
  intl: any # §279 — версию пинит flutter_localizations
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  cryptography: ^2.7.0 # §025 — X25519 keygen; §130 — ECDSA P-256 keygen для MASQUE-WARP
  asn1lib: ^1.5.0 # §130 — SEC1/PKIX DER-сериализация ECDSA-ключей (контракт с ядром MASQUE)
  json5: ^0.8.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  collection: ^1.18.0
  crypto: ^3.0.3 # §283 — sha256 для identity-хеша ноды подписки
  pointycastle: ^4.0.0 # §130 — ECDSA P-256 keygen (pure-Dart, работает на Android; cryptography P-256 keygen не реализует)
  re_editor: ^0.10.0
  mobile_scanner: ^7.1.2 # §375 — QR-сканер (ML Kit barcode; +3.8 МБ к APK, arm64)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  analyzer: any # §279 — AST-checkers tool/l10n (версию диктует Dart SDK)
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/wizard_template.json
    - assets/l10n/ru/ # §285 — русская локализация (ui.json + template.json; английский базовый, в коде)
    - assets/donate.json # §362 — способы поддержки (донат-попап в About)
    - assets/warp_endpoints.json # §136 — WARP endpoint/SNI random pools
    - assets/icons/app_icon.png
    - assets/icons/cloudflare.png # §025 — официальный логотип Cloudflare (Simple Icons, CC0)

# Иконка из sing-box Launcher (macOS .app Resources/app.icns → PNG 1024²).
flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
