name: lxbox
description: L×Box — Android MVP (sing-box + Clash API).
publish_to: 'none'

version: 1.8.2-dev.39+424
# ↑ placeholder. Реальная версия записывается из git tag:
#   • CI release build (.github/workflows/ci.yml → "Inject release version") —
#     `version: ${tag#v}+${git rev-list --count HEAD}` перед `flutter build`.
#   • Локальная сборка (scripts/build-local-apk.sh) — `git describe --tags --abbrev=0`
#     для versionName и `rev-list --count HEAD` для versionCode, revert на EXIT.
# Никогда не редактируется в репо вручную при release-flow (см. docs/RELEASE_PROCESS.md).

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  json5: ^0.8.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4
  share_plus: ^10.1.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  connectivity_plus: ^6.0.5
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/wizard_template.json
    - assets/icons/app_icon.png

# Иконка из sing-box Launcher (macOS .app Resources/app.icns → PNG 1024²).
flutter_launcher_icons:
  image_path: assets/icons/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
  windows:
    generate: true
  web:
    generate: true
