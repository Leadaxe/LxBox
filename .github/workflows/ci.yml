# LxBox — CI/CD
#
# Ветки:
#   - develop — основная ветка разработки (все feature/fix PR'ы)
#   - main    — только релизные коммиты (merge из develop + тег vX.Y.Z)
# См. docs/RELEASE_PROCESS.md для полного протокола.
#
# 1) Tag push (v*):            checks → build → GitHub Release → publish-manifest
# 2) push develop / main:      checks only
# 3) PR → develop / main:      checks only
# 4) workflow_dispatch:        checks | build | release (ручной)

name: CI

on:
  push:
    branches: [main, develop]
    tags:
      - "v*"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_mode:
        description: "checks | build | release"
        required: true
        default: "checks"
        type: choice
        options: [checks, build, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Meta
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.inputs.run_mode }}" == "release" ]]; then
            VERSION="$(git describe --tags --always)"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA="$(git rev-parse --short=7 HEAD)"
            echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    if: startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_mode != 'checks')
    needs: [meta, checks]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Нужны полные refs для `git rev-list --count HEAD` (versionCode).
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch sing-box-lx core (libbox.aar)
        # §104 — ядро: fork Leadaxe/sing-box-lx (AWG2 + XHTTP). AAR не в git;
        # скачиваем из GH Releases форка с проверкой SHA256. Пин версии —
        # app/android/libbox.version (single source для local + CI).
        working-directory: .
        run: ./scripts/fetch-libbox.sh

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.6"
          cache: true

      - name: Inject release version from tag
        # Pre-commit hook (.githooks/pre-commit) синхронизирует pubspec на
        # каждом commit'е, но на момент tag'а HEAD имеет `-dev.N` версию
        # (последний dev-commit до tag). CI override'ит на чистую `X.Y.Z`.
        # Symmetric с scripts/sync-pubspec-version.sh — та же формула.
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          VERSION="${VERSION#v}"
          BUILD_NUMBER=$(git rev-list --count HEAD)
          sed -i.bak -E "s/^version: .*/version: $VERSION+$BUILD_NUMBER/" pubspec.yaml
          rm -f pubspec.yaml.bak
          echo "Injected: $VERSION+$BUILD_NUMBER"

      - name: Dependencies
        run: flutter pub get

      - name: Android release keystore (optional)
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret; release APK will use debug signing."
            exit 0
          fi
          : "${ANDROID_KEYSTORE_PASSWORD:?Set ANDROID_KEYSTORE_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_PASSWORD:?Set ANDROID_KEY_PASSWORD when BASE64 is set}"
          : "${ANDROID_KEY_ALIAS:?Set ANDROID_KEY_ALIAS when BASE64 is set}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build universal APK (fat, all ABIs)
        # Fat APK с native libs для всех 3 ABI — fallback для юзеров которые
        # не знают свою архитектуру (или для устройств где per-ABI APK не
        # подходит). Размер ~75 MB.
        #
        # Output: build/app/outputs/flutter-apk/app-release.apk
        run: flutter build apk --release

      - name: Rename universal APK
        # Переименовываем pre-emptively чтобы split-per-abi build на следующем
        # шаге не перетёр (split-per-abi не пишет в `app-release.apk`, но на
        # всякий случай — defensive).
        #
        # Шаг бежит с `working-directory: app` (job-default), поэтому пути —
        # относительные внутри `app/`, без `app/` префикса.
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/app-universal-release.apk

      - name: Build per-ABI APKs (split-per-abi)
        # `--split-per-abi` собирает по APK на ABI — каждый содержит свои
        # native libs (libbox.so etc.) только для своей архитектуры. Итог:
        # 3 файла, каждый ~32-35 MB.
        #
        # ABIs:
        #   - arm64-v8a:    95%+ современных Android-устройств (default).
        #   - armeabi-v7a:  старые / Android Go бюджет (Itel A48, Tecno Pop 5).
        #   - x86_64:       эмуляторы / Chromebooks с Android-runtime'ом.
        #
        # Output paths:
        #   build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        #   build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        #   build/app/outputs/flutter-apk/app-x86_64-release.apk
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs (release)
        # Загружаем все 4: 3 per-ABI + 1 universal.
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-release
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 30 }}

  release:
    name: Create Release
    needs: [meta, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.meta.outputs.is_release == 'true'
    steps:
      - name: Checkout (for release notes)
        uses: actions/checkout@v4
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: android-apks-release
          path: release-artifacts

      - name: Prepare APKs
        # Renames per-ABI / universal files to LxBox-vX.Y.Z-<variant>.apk
        # для консистентности с прошлыми релизами (UpdateChecker парсит имя).
        run: |
          set -euo pipefail
          VERSION="${{ needs.meta.outputs.version }}"
          for VARIANT in arm64-v8a armeabi-v7a x86_64 universal; do
            SRC=$(find release-artifacts/ -name "app-${VARIANT}-release.apk" -type f | head -1)
            if [ -z "$SRC" ]; then
              echo "ERROR: APK for variant=$VARIANT not found!"
              exit 1
            fi
            cp "$SRC" "LxBox-${VERSION}-${VARIANT}.apk"
          done
          ls -la LxBox-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: LxBox ${{ needs.meta.outputs.version }}
          draft: false
          files: |
            LxBox-${{ needs.meta.outputs.version }}-arm64-v8a.apk
            LxBox-${{ needs.meta.outputs.version }}-armeabi-v7a.apk
            LxBox-${{ needs.meta.outputs.version }}-x86_64.apk
            LxBox-${{ needs.meta.outputs.version }}-universal.apk
          body_path: RELEASE_NOTES.md

  publish-manifest:
    name: Publish docs/latest.json
    needs: [meta, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: needs.meta.outputs.is_release == 'true'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update docs/latest.json
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p docs
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/Leadaxe/LxBox/releases/download/${TAG}"
          cat > docs/latest.json <<EOF
          {
            "\$schema": "https://github.com/Leadaxe/LxBox/blob/main/docs/latest.json",
            "tag": "${TAG}",
            "name": "L×Box ${VERSION}",
            "published_at": "${NOW}",
            "html_url": "https://github.com/Leadaxe/LxBox/releases/tag/${TAG}",
            "apk_url": "${BASE}/LxBox-${VERSION}-universal.apk",
            "apk_urls": {
              "arm64-v8a":   "${BASE}/LxBox-${VERSION}-arm64-v8a.apk",
              "armeabi-v7a": "${BASE}/LxBox-${VERSION}-armeabi-v7a.apk",
              "x86_64":      "${BASE}/LxBox-${VERSION}-x86_64.apk",
              "universal":   "${BASE}/LxBox-${VERSION}-universal.apk"
            },
            "min_supported": "1.0.0",
            "_comment": "Updated automatically by CI on every release tag push (see .github/workflows/ci.yml). Used by UpdateChecker as a fallback when api.github.com is rate-limited. apk_url = universal fallback (works on any ABI). apk_urls.<abi> = per-architecture optimized variants."
          }
          EOF
          cat docs/latest.json

      - name: Commit & push (main)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet docs/latest.json; then
            echo "No change in docs/latest.json — skipping commit."
            exit 0
          fi
          git add docs/latest.json
          # [skip ci] чтобы не триггерить новый CI run на собственный коммит
          git commit -m "chore(release): update docs/latest.json → ${{ needs.meta.outputs.tag }} [skip ci]"
          git push origin HEAD:main
